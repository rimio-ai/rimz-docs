name: Sync upstream docs

on:
  repository_dispatch:
    types: [docs-updated, release-published]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: rimio-ai/rimz
          path: rimz
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: RIMZ_SRC=rimz node scripts/sync-versions.mjs
      # The site type-checks **/*.ts; upstream plugins belong to RimZ, not
      # this application, and must be outside that scope before building.
      - name: Remove temporary upstream checkout
        run: rm -rf rimz
      - run: node scripts/check-content.mjs
      # Content checks do not compile MDX. Reject invalid imports before they
      # reach main, rather than discovering them in the deployment build.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://rimz.rimio.ai
      - run: pnpm check:output
      - id: commit
        run: |
          git add content public
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "docs(content): sync RimZ documentation from trunk and release tags"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
